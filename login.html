<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — EduEngineering</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav>
  <a href="index.html" class="brand"><span class="mark"><span>E</span></span> EduEngineering</a>
  <div class="navlinks">
    <a href="signup.html">Register your team</a>
  </div>
</nav>

<section class="wrap-narrow" style="padding-top:20px;">
  <div class="eyebrow mono" style="color:var(--orange-dark)">Admin login</div>
  <h2>Log in to your dashboard</h2>

  <div id="msg" class="msg hidden"></div>

  <form id="loginForm" class="form-panel">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Log in →</button>
  </form>
  <p class="muted" style="margin-top:16px;">New team? <a href="signup.html">Register here</a></p>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
const form = document.getElementById("loginForm");
const msg = document.getElementById("msg");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  submitBtn.disabled = true;
  submitBtn.textContent = "Logging in…";
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) {
    showMsg(msg, error.message, "error");
    submitBtn.disabled = false;
    submitBtn.textContent = "Log in →";
    return;
  }

  // Route master admin to master.html, everyone else to dashboard.html
  const { data: cfg } = await supabaseClient.from("app_config").select("value").eq("key","master_admin_email").maybeSingle();
  if (cfg && cfg.value === email) {
    window.location.href = "master.html";
  } else {
    window.location.href = "dashboard.html";
  }
});
</script>
</body>
</html>
